        filters:
        - dimension: event_group
          op: in
          values:
          - Chat
    encode:
      x: event_date__day
      y: events
  - id: hands_help
    type: text
    title: Raised hands
    text: Sessions in which at least one attendee raised a hand, and how many hands were raised.
  - id: hand_sessions_kpi
    type: kpi
    title: In how many sessions were hands raised?
