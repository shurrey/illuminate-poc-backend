      previous:
        measures:
        - dataset.collab_sessions.v1:max_attendees
        time_dimension: start_date
        date_filter: comparison
        param_filters:
        - dimension: attendee_count
          op: gte
          param: min_attendees
    transform:
      kind: period_over_period
      value: current
      baseline: previous
      field: max_attendees
    encode:
      value: value
  - id: attendance_min_kpi
    type: kpi
    title: What's the minimum session attendance?
    queries:
      current:
        measures:
        - dataset.collab_sessions.v1:min_attendees
        time_dimension: start_date
        param_filters:
        - dimension: attendee_count
          op: gte
          param: min_attendees
      previous:
        measures:
        - dataset.collab_sessions.v1:min_attendees
        time_dimension: start_date
        date_filter: comparison
        param_filters:
        - dimension: attendee_count
          op: gte
          param: min_attendees
    transform:
      kind: period_over_period
      value: current
      baseline: previous
      field: min_attendees
    encode:
      value: value
  - id: attendees_help
    type: text
    title: Total unique attendees
    text: Unique attendees counts each person once per day they first joined a session. The distribution counts attendances
      by day.
  - id: unique_attendees_primary
    type: bar
    title: Primary range - How many unique attendees were there?
    queries:
      main:
        measures:
        - dataset.collab_attendance.v1:attendees
        time_dimension: join_date
        dimensions:
        - join_date__day
        order_by:
        - field: join_date__day
          direction: asc
        limit: 400
    encode:
      x: join_date__day
      y: attendees
  - id: unique_attendees_comparison
    type: bar
    title: Comparison range - How many unique attendees were there?
    queries:
      main:
        measures:
        - dataset.collab_attendance.v1:attendees
        time_dimension: join_date
        dimensions:
        - join_date__day
        order_by:
        - field: join_date__day
          direction: asc
        limit: 400
        date_filter: comparison
    encode:
      x: join_date__day
      y: attendees
  - id: attendances_primary
    type: bar
    title: Primary range - What's the session attendance distribution?
    queries:
      main:
        measures:
        - dataset.collab_attendance.v1:attendances
        time_dimension: join_date
        dimensions:
        - join_date__day
        order_by:
        - field: join_date__day
          direction: asc
        limit: 400
    encode:
      x: join_date__day
      y: attendances
  - id: attendances_comparison
    type: bar
    title: Comparison range - What's the session attendance distribution?
    queries:
      main:
