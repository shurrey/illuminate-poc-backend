id: report.collaboration_session_activity.v1
title: Collaboration Session Activity
area: leading
description: 'Who uses Collaborate sessions and when: sessions launched, rooms active, session length, attendance and feature
  use (chat, raised hands, polls, whiteboard), for a primary and a comparison date range.'
filters:
- id: dates
  label: Primary date range
  control: date_range
  time_dimension: dataset.collab_sessions.v1:start_date
  default: last_30_days
- id: comparison
  label: Comparison date range
  control: date_range
  time_dimension: dataset.collab_sessions.v1:start_date
  default: previous_30_days
- id: in_course
  label: Linked to a course
  control: select
  dimensions:
  - ref: in_course
  - ref: dataset.collab_sessions.v1:in_course
- id: term
  label: Course term
  control: multi_select
  dimension: dataset.collab_session_courses.v1:term_name
- id: ih1
  label: Institutional hierarchy level 1
  control: select
  exclude_values:
  - '-'
  - All Nodes
  dimensions:
  - ref: dataset.course_filters_ih.v1:ih_level_1
  - ref: ih_nodes
    op: path
- id: ih2
  label: Institutional hierarchy level 2
  control: select
  exclude_values:
  - '-'
  - All Nodes
  dimensions:
  - ref: dataset.course_filters_ih.v1:ih_level_2
  - ref: ih_nodes
    op: path
  depends_on:
  - ih1
- id: ih3
  label: Institutional hierarchy level 3
  control: select
  exclude_values:
  - '-'
  - All Nodes
  dimensions:
  - ref: dataset.course_filters_ih.v1:ih_level_3
  - ref: ih_nodes
    op: path
  depends_on:
  - ih1
  - ih2
- id: ih4
  label: Institutional hierarchy level 4+
  control: select
  exclude_values:
  - '-'
  - All Nodes
  dimensions:
  - ref: dataset.course_filters_ih.v1:ih_level_4
  - ref: ih_nodes
    op: path
  depends_on:
  - ih1
  - ih2
  - ih3
- id: min_attendees
  label: Minimum attendees per session
  control: number
  default: 1
pages:
- title: Session Activity and Duration
  visuals:
  - id: duration_help
    type: text
    title: Session duration
    text: Session length is the attended length of each Collaborate session that started in the date range, in minutes. Each
      statistic is over sessions, including sessions no one attended.
  - id: avg_length
    type: kpi
    title: What's the average session length?
    queries:
      current:
        measures:
        - dataset.collab_sessions.v1:avg_minutes
        time_dimension: start_date
      previous:
        measures:
        - dataset.collab_sessions.v1:avg_minutes
        time_dimension: start_date
        date_filter: comparison
    transform:
      kind: period_over_period
      value: current
      baseline: previous
      field: avg_minutes
    encode:
      value: value
  - id: median_length
    type: kpi
    title: What's the median session length?
    queries:
      current:
        measures:
        - dataset.collab_sessions.v1:median_minutes
        time_dimension: start_date
      previous:
        measures:
        - dataset.collab_sessions.v1:median_minutes
        time_dimension: start_date
        date_filter: comparison
    transform:
      kind: period_over_period
      value: current
      baseline: previous
      field: median_minutes
    encode:
      value: value
  - id: total_length
    type: kpi
    title: What's the session length sum?
    queries:
      current:
        measures:
        - dataset.collab_sessions.v1:total_minutes
        time_dimension: start_date
      previous:
        measures:
        - dataset.collab_sessions.v1:total_minutes
        time_dimension: start_date
        date_filter: comparison
    transform:
      kind: period_over_period
      value: current
      baseline: previous
      field: total_minutes
    encode:
      value: value
  - id: max_length
    type: kpi
    title: What's the maximum session length?
    queries:
      current:
        measures:
        - dataset.collab_sessions.v1:max_minutes
        time_dimension: start_date
      previous:
        measures:
        - dataset.collab_sessions.v1:max_minutes
        time_dimension: start_date
        date_filter: comparison
    transform:
      kind: period_over_period
      value: current
      baseline: previous
      field: max_minutes
    encode:
      value: value
  - id: min_length
    type: kpi
    title: What's the minimum session length?
    queries:
      current:
        measures:
        - dataset.collab_sessions.v1:min_minutes
        time_dimension: start_date
      previous:
        measures:
        - dataset.collab_sessions.v1:min_minutes
        time_dimension: start_date
        date_filter: comparison
    transform:
      kind: period_over_period
      value: current
      baseline: previous
      field: min_minutes
    encode:
      value: value
  - id: launched_help
    type: text
    title: Launched sessions and room activity
    text: A session is launched on the day it starts. A room is active on a day when one of its sessions starts that day.
  - id: sessions_primary
    type: line
    title: Primary range - How many sessions were launched?
    queries:
      main:
        measures:
        - dataset.collab_sessions.v1:sessions
        time_dimension: start_date
        dimensions:
        - start_date__day
        order_by:
        - field: start_date__day
          direction: asc
        limit: 400
    encode:
      x: start_date__day
      y: sessions
  - id: sessions_comparison
    type: line
    title: Comparison range - How many sessions were launched?
    queries:
      main:
        measures:
        - dataset.collab_sessions.v1:sessions
        time_dimension: start_date
        dimensions:
        - start_date__day
        order_by:
        - field: start_date__day
          direction: asc
        limit: 400
        date_filter: comparison
    encode:
      x: start_date__day
      y: sessions
  - id: rooms_primary
    type: line
    title: Primary range - How many rooms were active?
    queries:
      main:
        measures:
        - dataset.collab_sessions.v1:rooms
        time_dimension: start_date
        dimensions:
        - start_date__day
        order_by:
        - field: start_date__day
          direction: asc
        limit: 400
    encode:
      x: start_date__day
      y: rooms
  - id: rooms_comparison
    type: line
    title: Comparison range - How many rooms were active?
    queries:
      main:
        measures:
        - dataset.collab_sessions.v1:rooms
        time_dimension: start_date
        dimensions:
        - start_date__day
        order_by:
        - field: start_date__day
          direction: asc
        limit: 400
        date_filter: comparison
    encode:
      x: start_date__day
      y: rooms
  - id: minutes_primary
    type: line
    title: Primary range - How long were sessions?
    queries:
      main:
        measures:
        - dataset.collab_sessions.v1:total_minutes
        time_dimension: start_date
        dimensions:
        - start_date__day
        order_by:
        - field: start_date__day
          direction: asc
        limit: 400
    encode:
      x: start_date__day
      y: total_minutes
  - id: minutes_comparison
    type: line
    title: Comparison range - How long were sessions?
    queries:
      main:
        measures:
        - dataset.collab_sessions.v1:total_minutes
        time_dimension: start_date
        dimensions:
        - start_date__day
        order_by:
        - field: start_date__day
          direction: asc
        limit: 400
        date_filter: comparison
    encode:
      x: start_date__day
      y: total_minutes
- title: Session Attendance
  visuals:
  - id: attendance_help
    type: text
    title: Session attendance
    text: An attendance is one person joining one session. The attendance statistics are over sessions that started in the
      date range and had at least the minimum number of attendees.
  - id: attendance_avg_kpi
    type: kpi
    title: What's the average session attendance?
    queries:
      current:
        measures:
        - dataset.collab_sessions.v1:avg_attendees
        time_dimension: start_date
        param_filters:
        - dimension: attendee_count
          op: gte
          param: min_attendees
      previous:
        measures:
        - dataset.collab_sessions.v1:avg_attendees
        time_dimension: start_date
        date_filter: comparison
        param_filters:
        - dimension: attendee_count
          op: gte
          param: min_attendees
    transform:
      kind: period_over_period
      value: current
      baseline: previous
      field: avg_attendees
    encode:
      value: value
  - id: attendance_median_kpi
    type: kpi
    title: What's the median session attendance?
    queries:
      current:
        measures:
        - dataset.collab_sessions.v1:median_attendees
