- title: Session Engagement
  visuals:
  - id: status_help
    type: text
    title: Attendee status
    text: How often attendees set their status to away or back to available.
  - id: status_primary
    type: pie
    title: Primary range - What was the attendees' status?
    queries:
      main:
        measures:
        - dataset.collab_events.v1:events
        time_dimension: event_date
        dimensions:
        - event_label
        limit: 400
        filters:
        - dimension: event_group
          op: in
          values:
          - Status
        order_by:
        - field: events
          direction: desc
    encode:
      label: event_label
      value: events
      donut: true
  - id: status_comparison
    type: pie
    title: Comparison range - What was the attendees' status?
    queries:
      main:
        measures:
        - dataset.collab_events.v1:events
        time_dimension: event_date
        dimensions:
        - event_label
        limit: 400
        date_filter: comparison
        filters:
        - dimension: event_group
          op: in
          values:
          - Status
        order_by:
        - field: events
          direction: desc
    encode:
      label: event_label
      value: events
      donut: true
  - id: chat_help
