id: dataset.ally_alternative_formats.v1
display_name: Ally alternative format downloads
description: >
  One row per completed download of an Ally alternative format (audio, ePub, tagged PDF and so on): the date, the content object, the format, the course, and the course's institution hierarchy nodes as a ';'-separated list (filter with contains). Deviation: bbd-analytics also emits a row with no date for every day without events; here
  only events appear.
grain: one row per completed alternative-format download
domain: ally
source: bbdata-bbd-analytics snowflake/migrations/bbd_analytics/repeatable/R__PLATFORM_ALLY_ALTERNATIVE_FORMAT.sql
base_sql: |
  WITH course_ih AS (
      SELECT ihc.COURSE_ID,
             LISTAGG(DISTINCT ih.HIERARCHY_NAME_SEQ, ';') WITHIN GROUP (ORDER BY ih.HIERARCHY_NAME_SEQ) AS IH_NODES
      FROM {{ database }}.CDM_LMS.INSTITUTION_HIERARCHY_COURSE ihc
      JOIN {{ database }}.CDM_LMS.INSTITUTION_HIERARCHY ih ON ih.ID = ihc.INSTITUTION_HIERARCHY_ID
      GROUP BY ihc.COURSE_ID
  ),
  events AS (
      SELECT ae.EVENT_TIME,
             ae.EVENT_TIME::DATE AS EVENT_DATE,
             ae.DATA:objectId::STRING AS OBJECT_ID,
         ae.DATA:result:formatType::STRING AS FORMAT_TYPE,
             TRY_TO_NUMBER(REGEXP_SUBSTR(ae.DATA:contextId::STRING, '^_(\\d.*)_', 1, 1, 'e', 1)) AS COURSE_SOURCE_NUMBER
      FROM {{ database }}.CDM_TLM.ALLY_EVENTS ae
      WHERE ae.EVENT_TYPE = 'COMPLETE_DOWNLOAD_ALTERNATIVE_FORMAT'
  )
  SELECT e.*, c.ID AS COURSE_ID, ci.IH_NODES
  FROM events e
  LEFT JOIN {{ database }}.CDM_LMS.COURSE c ON TRY_TO_NUMBER(c.SOURCE_ID) = e.COURSE_SOURCE_NUMBER
  LEFT JOIN course_ih ci ON ci.COURSE_ID = c.ID
entities:
  - {name: course, column: COURSE_ID, type: foreign}
dimensions:
  - {name: event_date, column: EVENT_DATE, type: time, grains: [day, week, month, quarter, year]}
  - {name: format_type, column: FORMAT_TYPE, type: categorical, description: "The alternative format downloaded, e.g. audio or ePub", synonyms: [alternative format]}
  - {name: ih_nodes, column: IH_NODES, type: categorical, description: "';'-separated institution hierarchy paths; filter with contains"}
measures:
  - {name: downloads, agg: count, expr: "*", unit: events}
  - {name: content_objects, agg: count_distinct, expr: OBJECT_ID, unit: objects}
  - {name: courses, agg: count_distinct, expr: COURSE_ID, unit: courses}
pii_exempt:
  OBJECT_ID: "DATA:objectId, a content object id; ALLY_EVENTS.DATA is flagged as a whole for its user ids"
  COURSE_SOURCE_NUMBER: "Course number parsed from DATA:contextId"
  FORMAT_TYPE: "DATA:result:formatType, the alternative format name"
