id: dataset.course_tool_activity.v1
display_name: Course tool activity by hour
description: >
  Activity in each top-level course's tools over the last three years, per person and hour: minutes
  and activity rows, with the tool, the person's course role and availability flags. Each access
  counts once, for its own tool when it has one and otherwise for its content item's tool. Rows are
  per hour rather than per access time, and tool names are in English.
notes: >
  Deviation: bbd-analytics counts an access once for its tool and again for its content item's tool
  (99.8% of rows carry both), doubling or splitting minutes; here each access counts once, for its
  own tool when it has one and otherwise for its content item's tool. Rows are per hour rather than
  per access time, and tool names are translated to English.
grain: one row per course tool x person x hour with activity
domain: tools
source: bbdata-bbd-analytics procedures/orchestration/courseToolActivityHour/processCourseItemToolActivityHour.ts
base_sql: |
  WITH activity AS (
      SELECT a.PERSON_ID,
             IFF(a.TOOL_ID IS NOT NULL AND a.COURSE_ID IS NOT NULL, a.COURSE_ID, ict.COURSE_ID) AS COURSE_ID,
             IFF(a.TOOL_ID IS NOT NULL AND a.COURSE_ID IS NOT NULL, a.TOOL_ID, ict.TOOL_ID) AS TOOL_ID,
             DATE_TRUNC('hour', a.ACCESSED_TIME) AS ACTIVITY_HOUR,
             NVL(a.DURATION_SUM, 0) AS DURATION_SUM
      FROM {{ database }}.CDM_LMS.ACTIVITY a
      LEFT JOIN {{ database }}.CDM_LMS.COURSE_ITEM ci ON ci.ID = a.COURSE_ITEM_ID
      LEFT JOIN {{ database }}.CDM_LMS.COURSE_TOOL ict ON ict.ID = ci.COURSE_TOOL_ID
      WHERE a.ACCESSED_TIME >= DATEADD(year, -3, CURRENT_TIMESTAMP())
  ),
  per_hour AS (
      SELECT PERSON_ID, COURSE_ID, TOOL_ID, ACTIVITY_HOUR,
             SUM(DURATION_SUM) AS DURATION_SUM, COUNT(*) AS ACTIVITY_COUNT
      FROM activity
      WHERE COURSE_ID IS NOT NULL AND TOOL_ID IS NOT NULL
      GROUP BY PERSON_ID, COURSE_ID, TOOL_ID, ACTIVITY_HOUR
  )
  SELECT ct.ID AS COURSE_TOOL_ID,
         ct.COURSE_ID,
         ct.TOOL_ID,
         t.NAME AS TOOL_KEY,
         NVL(tr.TRANSLATION_VALUE, t.NAME) AS TOOL_NAME,
         ph.PERSON_ID,
         pc.ID AS PERSON_COURSE_ID,
         ph.ACTIVITY_HOUR,
         pc.COURSE_ROLE,
         NVL(pc.COURSE_ROLE_SOURCE_DESC, 'Unknown') AS COURSE_ROLE_SOURCE_DESC,
         NVL(pc.COURSE_ROLE_DESC, 'Unknown') AS COURSE_ROLE_DESC,
         NVL(c.AVAILABLE_IND, FALSE) AS COURSE_AVAILABLE_IND,
         NVL(ct.AVAILABLE_IND, FALSE) AS TOOL_AVAILABLE_IND,
         ph.DURATION_SUM / 60 AS MINUTES,
         ph.ACTIVITY_COUNT
  FROM {{ database }}.CDM_LMS.COURSE_TOOL ct
  JOIN {{ database }}.CDM_LMS.COURSE c ON c.ID = ct.COURSE_ID AND c.COURSE_PARENT_ID IS NULL
  JOIN {{ database }}.CDM_LMS.TOOL t ON t.ID = ct.TOOL_ID
  LEFT JOIN {{ database }}.CDM_LMS.TRANSLATION tr ON tr.TRANSLATION_KEY = t.NAME AND tr.LOCALE = 'en_US'
  JOIN per_hour ph ON ph.COURSE_ID = ct.COURSE_ID AND ph.TOOL_ID = ct.TOOL_ID
  LEFT JOIN {{ database }}.CDM_LMS.PERSON_COURSE pc ON pc.PERSON_ID = ph.PERSON_ID AND pc.COURSE_ID = ph.COURSE_ID
entities:
  - {name: course, column: COURSE_ID, type: foreign}
  - {name: person, column: PERSON_ID, type: foreign}
  - {name: person_course, column: PERSON_COURSE_ID, type: foreign}
dimensions:
  - {name: tool_name, column: TOOL_NAME, type: categorical, description: "English name, e.g. 'Content Folder'", synonyms: [tool]}
  - {name: tool_key, column: TOOL_KEY, type: categorical, description: "Untranslated key, e.g. 'resource/x-bb-folder.name'"}
  - {name: course_role, column: COURSE_ROLE, type: categorical, description: "S student, I instructor; NULL when the person has no enrollment in the course"}
  - {name: course_role_description, column: COURSE_ROLE_DESC, type: categorical}
  - {name: course_available, column: COURSE_AVAILABLE_IND, type: boolean}
  - {name: tool_available, column: TOOL_AVAILABLE_IND, type: boolean}
  - {name: activity_time, column: ACTIVITY_HOUR, type: time, grains: [hour, day, week, month, quarter, year]}
measures:
  - {name: people, agg: count_distinct, expr: PERSON_ID, unit: people}
  - {name: tools_used, agg: count_distinct, expr: COURSE_TOOL_ID, unit: tools}
  - {name: minutes, agg: sum, expr: MINUTES, unit: minutes, synonyms: [time in tools]}
  - {name: activity_rows, agg: sum, expr: ACTIVITY_COUNT, unit: activities}
  - {name: minutes_per_person, agg: ratio, numerator: minutes, denominator: people, unit: minutes}
filters:
  - {name: students, sql: "COURSE_ROLE = 'S'"}
  - {name: instructors, sql: "COURSE_ROLE = 'I'"}
pii_columns: [PERSON_ID, PERSON_COURSE_ID]
