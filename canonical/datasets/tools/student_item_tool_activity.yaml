id: dataset.student_item_tool_activity.v1
display_name: Student item and tool use
description: >
  Per active student enrollment and item or tool type used inside the course window: interactions,
  minutes, distinct items or tools used and the last access. Deviation: bbd-analytics adds a row with
  no type for every student without tool activity and files activity in tools that have no tool type
  under no type; here only types actually used appear, and tools without a tool type are left out.
grain: one row per active student enrollment x item-or-tool x type
domain: tools
source: bbdata-bbd-analytics snowflake/migrations/bbd_analytics/repeatable/R__TFV_STUDENT_ITEM_TOOL_ACTIVITY.sql
depends_on: [dataset.active_students.v1, dataset.item_tool.v1, dataset.item_tool_map.v1]
base_sql: |
  WITH item_and_tool_use AS (
      SELECT ac.PERSON_COURSE_ID, ac.PERSON_ID, ac.COURSE_ID, ac.COURSE_WEEKS, 'ITEM' AS ITEM_OR_TOOL,
             it.ITEM_TYPE AS TYPE, it.ITEM_TYPE_NAME AS TYPE_NAME, it.COURSE_ITEM_ID AS ITEM_OR_TOOL_ID,
             it.INTERACTION_CNT, it.MINUTES, it.LAST_ACCESSED_DATE
      FROM {{ ref('dataset.active_students.v1') }} ac
      JOIN {{ ref('dataset.item_tool.v1') }} it
        ON it.PERSON_COURSE_ID = ac.PERSON_COURSE_ID
       AND it.FIRST_ACCESSED_DATE BETWEEN ac.START_WEEK AND ac.END_WEEK + 7
      UNION ALL
      SELECT ac.PERSON_COURSE_ID, ac.PERSON_ID, ac.COURSE_ID, ac.COURSE_WEEKS, 'TOOL',
             t.SOURCE_ID, COALESCE(m.DISPLAY_NAME, tr.TRANSLATION_VALUE, t.SOURCE_ID), t.ID,
             cta.INTERACTION_CNT, NVL(cta.DURATION_SUM, 0) / 60, cta.LAST_ACCESSED_TIME::DATE
      FROM {{ ref('dataset.active_students.v1') }} ac
      JOIN {{ database }}.CDM_LMS.COURSE_TOOL_ACTIVITY cta
        ON cta.PERSON_COURSE_ID = ac.PERSON_COURSE_ID
       AND cta.FIRST_ACCESSED_TIME BETWEEN ac.START_WEEK AND ac.END_WEEK + 7
      JOIN {{ database }}.CDM_LMS.TOOL t ON t.ID = cta.TOOL_ID AND t.TOOL_TYPE IS NOT NULL
      LEFT JOIN {{ database }}.CDM_LMS.TRANSLATION tr ON tr.TRANSLATION_KEY = t.NAME AND tr.LOCALE = 'en_US'
      LEFT JOIN {{ ref('dataset.item_tool_map.v1') }} m ON LOWER(m.ITEM_TYPE) = LOWER(t.SOURCE_ID)
  )
  SELECT PERSON_COURSE_ID, ANY_VALUE(PERSON_ID) AS PERSON_ID, ANY_VALUE(COURSE_ID) AS COURSE_ID,
         ANY_VALUE(COURSE_WEEKS) AS COURSE_WEEKS, ITEM_OR_TOOL, TYPE, ANY_VALUE(TYPE_NAME) AS TYPE_NAME,
         SUM(INTERACTION_CNT) AS INTERACTION_CNT,
         COUNT(DISTINCT ITEM_OR_TOOL_ID) AS USED,
         SUM(MINUTES) AS MINUTES,
         MAX(LAST_ACCESSED_DATE) AS LAST_ACCESSED_DATE
  FROM item_and_tool_use
  GROUP BY PERSON_COURSE_ID, ITEM_OR_TOOL, TYPE
entities:
  - {name: person_course, column: PERSON_COURSE_ID, type: foreign}
  - {name: course, column: COURSE_ID, type: foreign}
  - {name: person, column: PERSON_ID, type: foreign}
dimensions:
  - {name: item_or_tool, column: ITEM_OR_TOOL, type: categorical, description: "'ITEM' (course content) or 'TOOL'"}
  - {name: type, column: TYPE, type: categorical}
  - {name: type_name, column: TYPE_NAME, type: categorical, synonyms: [tool, content type]}
  - {name: course_weeks, column: COURSE_WEEKS, type: numeric}
  - {name: last_access, column: LAST_ACCESSED_DATE, type: time, grains: [day, week, month, quarter, year]}
measures:
  - {name: students, agg: count_distinct, expr: PERSON_ID, unit: students}
  - {name: enrollments, agg: count_distinct, expr: PERSON_COURSE_ID, unit: enrollments}
  - {name: interactions, agg: sum, expr: INTERACTION_CNT, unit: interactions}
  - {name: minutes, agg: sum, expr: MINUTES, unit: minutes}
  - {name: used, agg: sum, expr: USED, unit: items, description: "Distinct items or tools each enrollment used, summed"}
  - {name: minutes_per_student, agg: ratio, numerator: minutes, denominator: students, unit: minutes}
  - {name: interactions_per_student, agg: ratio, numerator: interactions, denominator: students, unit: interactions}
pii_columns: [PERSON_ID, PERSON_COURSE_ID]
