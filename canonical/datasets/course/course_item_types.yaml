id: dataset.course_item_types.v1
display_name: Course items by type
description: >
  One row per course and course item type used in course design (types that count towards tools per
  course; test questions, rubric criteria and calendar events are not counted), with its group
  (Assessment, Content, Tool, Other) and how many items of that type the course has. Statistics over
  rows (median, minimum, maximum items) are per course for each type.
grain: one row per course x course item type
domain: course
source: CDM_LMS.COURSE_ITEM, CDM_META.BBD_CALCULATION_DETAIL
depends_on: [dataset.item_tool_map.v1]
base_sql: |
  SELECT ci.COURSE_ID, ci.ITEM_TYPE,
         NVL(ANY_VALUE(m.DISPLAY_NAME), INITCAP(REPLACE(ci.ITEM_TYPE, '_', ' '))) AS ITEM_TYPE_NAME,
         DECODE(ANY_VALUE(ci.ITEM_GROUP), 'A', 'Assessment', 'C', 'Content', 'T', 'Tool', 'Other') AS ITEM_GROUP,
         COUNT(*) AS ITEMS
  FROM {{ database }}.CDM_LMS.COURSE_ITEM ci
  JOIN {{ ref('dataset.item_tool_map.v1') }} m ON m.ITEM_TYPE = ci.ITEM_TYPE AND m.TOOL_COUNT_IND = 1
  WHERE ci.ROW_DELETED_TIME IS NULL
  GROUP BY ci.COURSE_ID, ci.ITEM_TYPE
entities:
  - {name: course, column: COURSE_ID, type: foreign}
dimensions:
  - {name: item_type_name, column: ITEM_TYPE_NAME, type: categorical, synonyms: [course item type]}
  - {name: item_group, column: ITEM_GROUP, type: categorical, description: "Assessment, Content, Tool or Other"}
measures:
  - {name: courses, agg: count_distinct, expr: COURSE_ID, unit: courses, description: "Courses with at least one item of the type"}
  - {name: items, agg: sum, expr: ITEMS, unit: items}
  - {name: median_items, agg: median, expr: ITEMS, unit: items, description: "Median items per course that uses the type"}
  - {name: min_items, agg: min, expr: ITEMS, unit: items}
  - {name: max_items, agg: max, expr: ITEMS, unit: items}
