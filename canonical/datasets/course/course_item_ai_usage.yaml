id: dataset.course_item_ai_usage.v1
display_name: Course items and the AI Design Assistant
description: >
  One row per course item: its type, its creation date in the institution's timezone, whether it was
  created with the AI Design Assistant, whether it is available, whether its course has any item
  created with AI, and who created it. Course attributes (term, duration, dates, hierarchy levels,
  number, name) come from the courses dataset. Items with no AI status count as created without AI.
grain: one row per course item
domain: course
source: CDM_LMS.COURSE_ITEM, CDM_LMS.PERSON
depends_on: [dataset.item_tool_map.v1]
base_sql: |
  WITH items AS (
      SELECT ci.ID AS COURSE_ITEM_ID, ci.COURSE_ID, ci.PERSON_ID AS CREATOR_ID, ci.ITEM_TYPE,
             CONVERT_TIMEZONE(NVL(li.STAGE:timezone::STRING, 'UTC'), ci.CREATED_TIME)::DATE AS CREATED_DATE,
             IFF(ci.AI_STATUS IN ('Y', 'P'), 'Yes', 'No') AS AI_USED,
             IFF(ci.AVAILABLE_IND, 'Yes', 'No') AS AVAILABLE
      FROM {{ database }}.CDM_LMS.COURSE_ITEM ci
      LEFT JOIN {{ database }}.CDM_LMS.INSTANCE li ON li.ID = ci.INSTANCE_ID
      WHERE ci.ROW_DELETED_TIME IS NULL
  )
  SELECT i.COURSE_ITEM_ID, i.COURSE_ID, i.CREATOR_ID, i.CREATED_DATE, i.AI_USED, i.AVAILABLE,
         NVL(m.DISPLAY_NAME, INITCAP(REPLACE(i.ITEM_TYPE, '_', ' '))) AS ITEM_TYPE_NAME,
         IFF(MAX(IFF(i.AI_USED = 'Yes', 1, 0)) OVER (PARTITION BY i.COURSE_ID) = 1, 'Yes', 'No') AS COURSE_USES_AI,
         TRIM(CONCAT(NVL(p.FIRST_NAME, ''), ' ', NVL(p.LAST_NAME, ''))) AS CREATOR_NAME,
         p.EMAIL AS CREATOR_EMAIL
  FROM items i
  LEFT JOIN {{ ref('dataset.item_tool_map.v1') }} m ON m.ITEM_TYPE = i.ITEM_TYPE
  LEFT JOIN {{ database }}.CDM_LMS.PERSON p ON p.ID = i.CREATOR_ID
entities:
  - {name: course_item, column: COURSE_ITEM_ID, type: primary}
  - {name: course, column: COURSE_ID, type: foreign}
  - {name: person, column: CREATOR_ID, type: foreign}
dimensions:
  - {name: item_type_name, column: ITEM_TYPE_NAME, type: categorical, synonyms: [course item type]}
  - {name: created_date, column: CREATED_DATE, type: time, grains: [day, week, month, quarter, year]}
  - {name: ai_used, column: AI_USED, type: categorical, description: "'Yes' when the item was created with the AI Design Assistant", synonyms: [ai design assistant]}
  - {name: available, column: AVAILABLE, type: categorical, description: "'Yes' when the item is available to students"}
  - {name: course_uses_ai, column: COURSE_USES_AI, type: categorical, description: "'Yes' when any item in the course was created with AI"}
  - {name: creator_name, column: CREATOR_NAME, type: categorical}
  - {name: creator_email, column: CREATOR_EMAIL, type: categorical}
measures:
  - {name: items, agg: count_distinct, expr: COURSE_ITEM_ID, unit: items}
  - {name: ai_items, agg: count_distinct, expr: "IFF(AI_USED = 'Yes', COURSE_ITEM_ID, NULL)", unit: items, synonyms: [items created with ai]}
  - {name: pct_ai_items, agg: avg, expr: "IFF(AI_USED = 'Yes', 100, 0)", unit: percent, description: "Share of items created with AI"}
  - {name: pct_not_ai_items, agg: avg, expr: "IFF(AI_USED = 'Yes', 0, 100)", unit: percent}
  - {name: courses, agg: count_distinct, expr: COURSE_ID, unit: courses}
  - {name: ai_courses, agg: count_distinct, expr: "IFF(AI_USED = 'Yes', COURSE_ID, NULL)", unit: courses, description: "Courses with at least one item created with AI"}
  - {name: pct_ai_courses, agg: ratio, numerator: ai_courses, denominator: courses, unit: ratio}
  - {name: ai_creators, agg: count_distinct, expr: "IFF(AI_USED = 'Yes', CREATOR_ID, NULL)", unit: people, description: "People who created an item with AI"}
  - {name: available_ai_items, agg: count_distinct, expr: "IFF(AI_USED = 'Yes' AND AVAILABLE = 'Yes', COURSE_ITEM_ID, NULL)", unit: items}
  - {name: unavailable_ai_items, agg: count_distinct, expr: "IFF(AI_USED = 'Yes' AND AVAILABLE = 'No', COURSE_ITEM_ID, NULL)", unit: items}
pii_columns: [CREATOR_ID, CREATOR_NAME, CREATOR_EMAIL]
