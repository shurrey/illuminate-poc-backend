id: dataset.collab_sessions.v1
display_name: Collaborate sessions
description: >
  One row per Collaborate session that has started: its start date in the institution's timezone,
  room, attended length in minutes, number of attendances, whether its room is linked to a course,
  and the institution hierarchy nodes of the linked courses as a ';'-separated list. Session length
  and attendance statistics (average, median, maximum, minimum) are over sessions.
grain: one row per Collaborate session
domain: collaborate
source: CDM_CLB.SESSION, CDM_CLB.ATTENDANCE
base_sql: |
  WITH room_ih AS (
      SELECT cr.CLB_ROOM_ID AS ROOM_ID,
             ';' || LISTAGG(DISTINCT ih.HIERARCHY_NAME_SEQ, ';') WITHIN GROUP (ORDER BY ih.HIERARCHY_NAME_SEQ) AS IH_NODES
      FROM {{ database }}.CDM_MAP.COURSE_ROOM cr
      JOIN {{ database }}.CDM_LMS.INSTITUTION_HIERARCHY_COURSE ihc ON ihc.COURSE_ID = cr.LMS_COURSE_ID
      JOIN {{ database }}.CDM_LMS.INSTITUTION_HIERARCHY ih ON ih.ID = ihc.INSTITUTION_HIERARCHY_ID
      GROUP BY cr.CLB_ROOM_ID
  ),
  linked_rooms AS (
      SELECT DISTINCT CLB_ROOM_ID AS ROOM_ID FROM {{ database }}.CDM_MAP.COURSE_ROOM WHERE LMS_COURSE_ID IS NOT NULL
  ),
  instance_tz AS (
      SELECT mi.CLB_INSTANCE_ID, ANY_VALUE(NVL(li.STAGE:timezone::STRING, 'UTC')) AS TZ
      FROM {{ database }}.CDM_MAP.INSTANCE mi
      JOIN {{ database }}.CDM_LMS.INSTANCE li ON li.ID = mi.LMS_INSTANCE_ID
      GROUP BY mi.CLB_INSTANCE_ID
  ),
  attendance AS (
      SELECT SESSION_ID, COUNT(DISTINCT ID) AS ATTENDEE_COUNT FROM {{ database }}.CDM_CLB.ATTENDANCE GROUP BY SESSION_ID
  )
  SELECT s.ID AS SESSION_ID, s.ROOM_ID,
         CONVERT_TIMEZONE(NVL(tz.TZ, 'UTC'), s.START_TIME)::DATE AS START_DATE,
         s.ATTENDED_DURATION / 60 AS MINUTES,
         NVL(a.ATTENDEE_COUNT, 0) AS ATTENDEE_COUNT,
         IFF(lr.ROOM_ID IS NULL, 'No', 'Yes') AS IN_COURSE,
         ri.IH_NODES
  FROM {{ database }}.CDM_CLB.SESSION s
  LEFT JOIN instance_tz tz ON tz.CLB_INSTANCE_ID = s.INSTANCE_ID
  LEFT JOIN attendance a ON a.SESSION_ID = s.ID
  LEFT JOIN linked_rooms lr ON lr.ROOM_ID = s.ROOM_ID
  LEFT JOIN room_ih ri ON ri.ROOM_ID = s.ROOM_ID
  WHERE s.ROW_DELETED_TIME IS NULL AND s.START_TIME IS NOT NULL
entities:
  - {name: collab_session, column: SESSION_ID, type: primary}
  - {name: collab_room, column: ROOM_ID, type: foreign}
dimensions:
  - {name: start_date, column: START_DATE, type: time, grains: [day, week, month, quarter, year]}
  - {name: in_course, column: IN_COURSE, type: categorical, description: "'Yes' when the session's room is linked to a course"}
  - {name: ih_nodes, column: IH_NODES, type: categorical, description: "Hierarchy paths of the courses involved, each written as ;||Level 1||Level 2||"}
measures:
  - {name: sessions, agg: count_distinct, expr: SESSION_ID, unit: sessions, synonyms: [sessions launched]}
  - {name: rooms, agg: count_distinct, expr: ROOM_ID, unit: rooms, synonyms: [active rooms]}
  - {name: total_minutes, agg: sum, expr: MINUTES, unit: minutes, description: "Attended length of the sessions"}
  - {name: avg_minutes, agg: avg, expr: MINUTES, unit: minutes, synonyms: [average session length]}
  - {name: median_minutes, agg: median, expr: MINUTES, unit: minutes}
  - {name: max_minutes, agg: max, expr: MINUTES, unit: minutes}
  - {name: min_minutes, agg: min, expr: MINUTES, unit: minutes}
  - {name: avg_attendees, agg: avg, expr: ATTENDEE_COUNT, unit: attendances, description: "Attendances per session, averaged over sessions"}
  - {name: median_attendees, agg: median, expr: ATTENDEE_COUNT, unit: attendances}
  - {name: max_attendees, agg: max, expr: ATTENDEE_COUNT, unit: attendances}
  - {name: min_attendees, agg: min, expr: ATTENDEE_COUNT, unit: attendances}
