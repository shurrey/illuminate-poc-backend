id: dataset.student_enrollments.v1
display_name: Student enrollments
description: >
  One row per student enrollment in a reported course (top-level, started, with a student), active
  or not: the student's name, email and id, minutes, accesses, interactions and submissions in the
  course window, access frequency (share of course days with activity, 0-100), content items
  reviewed and completed, and engagement. A student is Active with 5 minutes or more in the course;
  recency is Recently active (last access within 7 days), Previously active, or Inactive.
grain: one row per student enrollment
domain: engagement
source: CDM_LMS.PERSON_COURSE, CDM_LMS.PERSON, CDM_LMS.COURSE_ACTIVITY
depends_on: [dataset.course_filters.v1, dataset.course_student_activity.v1]
base_sql: |
  WITH courses AS (
      SELECT COURSE_ID, MAX(COURSE_WEEKS) AS COURSE_WEEKS FROM {{ ref('dataset.course_filters.v1') }} GROUP BY COURSE_ID
  ),
  enrollments AS (
      SELECT pc.ID AS PERSON_COURSE_ID, pc.COURSE_ID, pc.PERSON_ID, c.COURSE_WEEKS,
             pe.FIRST_NAME, pe.LAST_NAME, pe.EMAIL,
             COALESCE(pe.STAGE:student_id, pe.STAGE:user_id, pe.STAGE:batch_uid, pe.SOURCE_ID)::STRING AS STUDENT_ID
      FROM {{ database }}.CDM_LMS.PERSON_COURSE pc
      JOIN courses c ON c.COURSE_ID = pc.COURSE_ID
      JOIN {{ database }}.CDM_LMS.PERSON pe ON pe.ID = pc.PERSON_ID
      WHERE pc.COURSE_ROLE = 'S' AND pc.ROW_DELETED_TIME IS NULL
        AND pe.LAST_NAME NOT LIKE '%PreviewUser' AND pe.LAST_NAME NOT LIKE 'bbsupport%'
  ),
  joined AS (
      SELECT e.*,
             NVL(a.TOTAL_MIN_IN_COURSE, 0) AS MINUTES, NVL(a.ACCESSES_COUNT, 0) AS ACCESSES,
             NVL(a.INTERACTION_COUNT, 0) AS INTERACTIONS, NVL(a.SUBMISSION_COUNT, 0) AS SUBMISSIONS,
             a.LAST_ACCESSED_TIME AS LAST_ACCESS,
             LEAST(100, 100 * NVL(a.PERCENT_ACTIVITY, 0)) AS ACCESS_PCT,
             NVL(a.PERSON_REVIEWED_CONTENT_ITEMS_CNT, 0) AS CONTENT_REVIEWED,
             NVL(a.PERSON_COMPLETED_CONTENT_ITEMS_CNT, 0) AS CONTENT_COMPLETED,
             NVL(a.TOTAL_COURSE_CONTENT_ITEM_CNT, 0) AS COURSE_CONTENT_ITEMS
      FROM enrollments e
      LEFT JOIN {{ ref('dataset.course_student_activity.v1') }} a ON a.PERSON_COURSE_ID = e.PERSON_COURSE_ID
  )
  SELECT j.*,
         IFF(MINUTES >= 5, 'Active', 'Inactive') AS ENGAGED,
         CASE WHEN MINUTES < 5 THEN 'Inactive'
              WHEN LAST_ACCESS >= DATEADD(day, -7, CURRENT_DATE()) THEN 'Recently active'
              ELSE 'Previously active' END AS RECENCY,
         IFF(ACCESS_PCT >= 95, '95-100',
             CONCAT(LPAD(TO_VARCHAR(FLOOR(ACCESS_PCT / 5) * 5), 2, '0'), '-', LPAD(TO_VARCHAR(FLOOR(ACCESS_PCT / 5) * 5 + 5), 2, '0'))) AS ACCESS_BIN,
         IFF(INTERACTIONS >= 500, '500+', CONCAT(TO_VARCHAR(FLOOR(INTERACTIONS / 25) * 25), '-', TO_VARCHAR(FLOOR(INTERACTIONS / 25) * 25 + 24))) AS INTERACTIONS_BIN,
         LEAST(FLOOR(INTERACTIONS / 25) * 25, 500) AS INTERACTIONS_BIN_START,
         MINUTES / 60 / GREATEST(NVL(COURSE_WEEKS, 1), 1) AS HOURS_PER_WEEK
  FROM joined j
entities:
  - {name: person_course, column: PERSON_COURSE_ID, type: primary}
  - {name: course, column: COURSE_ID, type: foreign}
  - {name: person, column: PERSON_ID, type: foreign}
dimensions:
  - {name: student_first_name, column: FIRST_NAME, type: categorical}
  - {name: student_last_name, column: LAST_NAME, type: categorical}
  - {name: student_email, column: EMAIL, type: categorical}
  - {name: student_id, column: STUDENT_ID, type: categorical}
  - {name: engaged, column: ENGAGED, type: categorical, description: "Active with 5 minutes or more in the course, else Inactive"}
  - {name: recency, column: RECENCY, type: categorical, description: "Recently active (last access within 7 days), Previously active, or Inactive"}
  - {name: access_bin, column: ACCESS_BIN, type: categorical, description: "Access frequency in 5-point steps ('00-05' ... '95-100')"}
  - {name: interactions_bin, column: INTERACTIONS_BIN, type: categorical, description: "Interactions in 25s ('0-24' ... '500+'); sort by interactions_bin_start"}
  - {name: interactions_bin_start, column: INTERACTIONS_BIN_START, type: numeric}
  - {name: last_access, column: LAST_ACCESS, type: time, grains: [day, week, month]}
measures:
  - {name: enrollments, agg: count_distinct, expr: PERSON_COURSE_ID, unit: enrollments}
  - {name: students, agg: count_distinct, expr: PERSON_ID, unit: students}
  - {name: active_enrollments, agg: count_distinct, expr: "IFF(ENGAGED = 'Active', PERSON_COURSE_ID, NULL)", unit: enrollments}
  - {name: inactive_enrollments, agg: count_distinct, expr: "IFF(ENGAGED = 'Inactive', PERSON_COURSE_ID, NULL)", unit: enrollments}
  - {name: recently_active_enrollments, agg: count_distinct, expr: "IFF(RECENCY = 'Recently active', PERSON_COURSE_ID, NULL)", unit: enrollments}
  - {name: pct_active, agg: avg, expr: "IFF(ENGAGED = 'Active', 100, 0)", unit: percent}
  - {name: pct_recently_active, agg: avg, expr: "IFF(RECENCY = 'Recently active', 100, 0)", unit: percent}
  - {name: access_pct, agg: max, expr: ACCESS_PCT, unit: percent, description: "Per enrollment: share of course days with activity"}
  - {name: median_access_pct, agg: median, expr: ACCESS_PCT, unit: percent}
  - {name: min_access_pct, agg: min, expr: ACCESS_PCT, unit: percent}
  - {name: max_access_pct, agg: max, expr: ACCESS_PCT, unit: percent}
  - {name: avg_access_pct, agg: avg, expr: ACCESS_PCT, unit: percent}
  - {name: minutes, agg: sum, expr: MINUTES, unit: minutes}
  - {name: hours, agg: sum, expr: "MINUTES / 60", unit: hours}
  - {name: avg_hours, agg: avg, expr: "MINUTES / 60", unit: hours, description: "Hours in the course per enrollment"}
  - {name: avg_hours_per_week, agg: avg, expr: HOURS_PER_WEEK, unit: hours}
  - {name: accesses, agg: sum, expr: ACCESSES, unit: accesses}
  - {name: interactions, agg: sum, expr: INTERACTIONS, unit: interactions}
  - {name: median_interactions, agg: median, expr: INTERACTIONS, unit: interactions}
  - {name: min_interactions, agg: min, expr: INTERACTIONS, unit: interactions}
  - {name: max_interactions, agg: max, expr: INTERACTIONS, unit: interactions}
  - {name: submissions, agg: sum, expr: SUBMISSIONS, unit: submissions}
  - {name: content_reviewed, agg: sum, expr: CONTENT_REVIEWED, unit: items}
  - {name: content_completed, agg: sum, expr: CONTENT_COMPLETED, unit: items}
  - {name: course_content_items, agg: sum, expr: COURSE_CONTENT_ITEMS, unit: items}
  - {name: content_completion, agg: ratio, numerator: content_completed, denominator: course_content_items, unit: ratio}
pii_columns: [PERSON_ID, PERSON_COURSE_ID, FIRST_NAME, LAST_NAME, EMAIL, STUDENT_ID]
